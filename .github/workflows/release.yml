# Builds Hourglance.app and publishes a GitHub release whenever a v* tag is pushed
# (scripts/release.sh does the bump + tag + push). Re-run it for an existing tag from the Actions tab.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag: { description: 'existing tag, e.g. v0.1.0', required: true }
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.tag || github.ref }}', fetch-depth: 0 }
      - name: Check the tag matches Info.plist
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"   # checkout drops the tag's annotation
          V=$(plutil -extract CFBundleShortVersionString raw Info.plist)
          [ "v$V" = "$TAG" ] || { echo "::error::Info.plist says $V but the tag is $TAG"; exit 1; }
          echo "V=$V" >> "$GITHUB_ENV"
      - run: swiftc --version && ./build.sh
      - name: Package
        run: |
          mkdir dist
          ditto -c -k --sequesterRsrc --keepParent build/Hourglance.app "dist/Hourglance-$V.zip"
          (cd dist && shasum -a 256 "Hourglance-$V.zip" > "Hourglance-$V.zip.sha256")
      - name: Release notes
        run: |
          git tag -l --format='%(contents:body)' "$TAG" > notes.md
          cat >> notes.md <<NOTES

          ## Install · 安装
          1. Download **Hourglance-$V.zip**, unzip, and drag **Hourglance.app** into **Applications**.
             下载 **Hourglance-$V.zip**，解压后把 **Hourglance.app** 拖进「应用程序」。
          2. The app is not notarized by Apple, so the first launch is blocked. Open **System Settings › Privacy & Security** and click **Open Anyway**, or run:
             App 没有经过 Apple 公证，第一次打开会被拦下。到「系统设置 › 隐私与安全性」点「仍要打开」，或在终端运行：
             \`\`\`
             xattr -dr com.apple.quarantine /Applications/Hourglance.app
             \`\`\`
          Universal (Apple Silicon + Intel), macOS 13 or later. · 通用版（Apple 芯片 + Intel），macOS 13 及以上。
          NOTES
      - name: Publish
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Hourglance $V" --notes-file notes.md --verify-tag
          fi
